<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>白狗回收 - 闲置鞋盒回收 | 48小时极速打款</title>
    <meta name="description" content="白狗回收专注潮流鞋盒回收服务。支持Nike、Jordan、Yeezy等品牌。拍照提交，先确认再寄出，验收无误48小时内微信打款。">
    
    <meta property="og:title" content="白狗回收 - 鞋盒变现更省心">
    <meta property="og:image" content="https://via.placeholder.com/800x400?text=Share+Image">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="js/tailwind.config.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-black antialiased font-sans" x-data="landingPage">
    <div class="noise-bg"></div>

    <nav class="fixed top-0 left-0 right-0 z-40 bg-black/80 backdrop-blur-md border-b border-white/10 text-white h-16 transition-all duration-300 transform" :class="loaded ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0'">
        <div class="container mx-auto px-4 h-full flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-lg tracking-tight cursor-pointer hover:opacity-80 transition-opacity" @click="window.scrollTo({top: 0, behavior: 'smooth'})">
                <div class="w-8 h-8 bg-white text-black rounded-lg flex items-center justify-center">
                    <i class="ph-bold ph-recycle"></i>
                </div>
                <span x-text="config.appName"></span>
            </div>
            <a href="#footer" class="text-sm font-medium text-gray-300 hover:text-white transition-colors px-4 py-2 border border-white/20 rounded-full hover:bg-white/10 active:scale-95 transform transition-transform">
                联系客服
            </a>
        </div>
    </nav>

    <header class="relative bg-black text-white pt-32 pb-20 overflow-hidden">
        <div class="absolute inset-0 bg-grid-pattern bg-grid opacity-20 pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/50 to-black pointer-events-none"></div>

        <div class="container mx-auto px-4 relative z-10">
            <div class="max-w-4xl mx-auto text-center">
                <div 
                    class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-white/20 bg-white/5 backdrop-blur-sm mb-8 reveal-base"
                    :class="loaded ? 'reveal-visible' : ''"
                >
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-xs font-mono text-gray-400">RECYCLE SYSTEM ONLINE</span>
                </div>

                <h1 
                    class="text-5xl md:text-8xl font-black tracking-tighter mb-6 leading-none reveal-base delay-100"
                    :class="loaded ? 'reveal-visible' : ''"
                >
                    鞋盒变现<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-600">更省心</span>
                </h1>

                <p 
                    class="text-lg md:text-xl text-gray-400 mb-10 max-w-lg mx-auto leading-relaxed reveal-base delay-200"
                    :class="loaded ? 'reveal-visible' : ''"
                >
                    拍照提交 · 确认后寄出 · 48H打款<br>
                    专业的闲置潮流鞋盒回收平台
                </p>

                <div 
                    class="flex flex-col md:flex-row items-center justify-center gap-4 reveal-base delay-300"
                    :class="loaded ? 'reveal-visible' : ''"
                >
                    <button 
                        @click="handleMainCTA"
                        class="w-full md:w-auto bg-white text-black h-14 px-8 rounded-full font-bold text-lg hover:scale-105 active:scale-95 hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all duration-300 flex items-center justify-center gap-2"
                    >
                        立即提交回收 <i class="ph-bold ph-arrow-right"></i>
                    </button>
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <i class="ph-fill ph-check-circle text-green-500"></i>
                        <span>已回收 10,000+ 个</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-yellow-400 text-black py-3 overflow-hidden border-y-2 border-black font-bold font-mono uppercase tracking-widest text-sm relative z-20">
        <div class="whitespace-nowrap flex animate-marquee">
            <template x-for="i in 10">
                <span class="mx-4 flex items-center gap-4">
                    <span x-text="marqueeText"></span>
                    <i class="ph-fill ph-star-four"></i>
                </span>
            </template>
        </div>
    </div>

    <section class="py-20 px-4 bg-gray-50 border-b border-gray-200">
        <div class="container mx-auto max-w-5xl">
            <div class="grid md:grid-cols-3 gap-0 border border-gray-200 bg-white shadow-sm">
                <template x-for="(feature, index) in features">
                    <div 
                        class="p-10 border-b md:border-b-0 md:border-r border-gray-200 last:border-0 hover:bg-gray-50 transition-colors group reveal-base"
                        x-intersect.half="$el.classList.add('reveal-visible')"
                        :style="`transition-delay: ${index * 100}ms`"
                    >
                        <div class="w-12 h-12 bg-black text-white rounded-lg flex items-center justify-center text-2xl mb-6 group-hover:rotate-12 group-hover:scale-110 transition-transform duration-300 ease-out">
                            <i :class="`ph-fill ph-${feature.icon}`"></i>
                        </div>
                        <h3 class="font-bold text-xl mb-2 text-black" x-text="feature.title"></h3>
                        <p class="text-sm text-gray-500 leading-relaxed" x-text="feature.desc"></p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section class="py-20 px-4 bg-white relative">
        <div class="absolute inset-0 bg-grid-pattern-light bg-grid opacity-30 pointer-events-none"></div>

        <div class="container mx-auto max-w-4xl relative z-10">
            <div 
                class="text-center mb-16 reveal-base" 
                x-intersect.half="$el.classList.add('reveal-visible')"
            >
                <h2 class="text-3xl md:text-4xl font-black mb-4">简单四步，变废为宝</h2>
                <p class="text-gray-500">标准化回收流程，全程透明可查</p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <template x-for="(step, index) in steps">
                    <div 
                        class="bg-gray-50 border border-gray-200 p-6 rounded-2xl relative overflow-hidden group hover:border-black hover:-translate-y-1 hover:shadow-lg transition-all duration-300 reveal-base"
                        x-intersect.half="$el.classList.add('reveal-visible')"
                        :style="`transition-delay: ${index * 100}ms`"
                    >
                        <div class="absolute -right-2 -top-4 text-8xl font-black text-gray-100 group-hover:text-gray-200 transition-colors pointer-events-none select-none duration-300" x-text="step.step"></div>
                        
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-full border-2 border-black flex items-center justify-center mb-4 bg-white group-hover:bg-black group-hover:text-white transition-colors duration-300">
                                <i :class="`ph-bold ph-${step.icon}`"></i>
                            </div>
                            <h4 class="font-bold text-lg mb-1" x-text="step.title"></h4>
                            <p class="text-xs text-gray-500 group-hover:text-gray-700 transition-colors" x-text="step.desc"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section class="py-20 px-4 bg-black text-white">
        <div class="container mx-auto max-w-3xl">
            <h2 
                class="text-3xl font-black mb-10 reveal-base"
                x-intersect.half="$el.classList.add('reveal-visible')"
            >
                常见问题
            </h2>
            <div class="space-y-4">
                <template x-for="(faq, index) in faqs" :key="index">
                    <div 
                        class="border-b border-gray-800 pb-4 reveal-base"
                        x-intersect.half="$el.classList.add('reveal-visible')"
                        :style="`transition-delay: ${index * 50}ms`"
                    >
                        <button 
                            @click="toggleFaq(index)"
                            class="w-full flex justify-between items-start text-left py-2 hover:text-gray-300 transition-colors group"
                        >
                            <span class="font-bold text-lg pr-8 group-hover:translate-x-1 transition-transform" x-text="faq.q"></span>
                            <i class="ph-bold ph-plus transition-transform duration-300 mt-1" :class="{'rotate-45 text-white': activeFaq === index, 'text-gray-500': activeFaq !== index}"></i>
                        </button>
                        <div x-show="activeFaq === index" x-collapse>
                            <div class="pt-2 pb-4 text-gray-400 leading-relaxed text-sm border-l-2 border-gray-800 pl-4 mt-2 ml-1">
                                <p x-text="faq.a"></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <footer id="footer" class="bg-gray-50 pt-20 pb-10 px-4 border-t border-gray-200">
        <div class="container mx-auto max-w-5xl">
            <div class="grid md:grid-cols-2 gap-12 mb-16 items-center">
                <div class="text-center md:text-left">
                    <div class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center text-3xl mb-6 mx-auto md:mx-0">
                        <i class="ph-bold ph-recycle"></i>
                    </div>
                    <h2 class="text-4xl font-black mb-2 tracking-tight">让闲置回归价值</h2>
                    <p class="text-gray-500">专业、透明、高效的潮流包装回收方案</p>
                </div>

                <div class="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm flex flex-col md:flex-row items-center gap-8 hover:shadow-lg transition-shadow duration-300">
                    <div class="w-32 h-32 bg-gray-100 rounded-xl shrink-0 p-2 group overflow-hidden cursor-zoom-in">
                        <img :src="config.qrCodeUrl" class="w-full h-full object-cover rounded-lg mix-blend-multiply group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="text-center md:text-left space-y-4 w-full">
                        <div class="p-3 bg-gray-50 rounded-xl flex items-center justify-between border border-gray-100 group hover:border-gray-300 transition-colors">
                            <div class="flex items-center gap-3">
                                <i class="ph-fill ph-wechat-logo text-green-600 text-xl group-hover:scale-110 transition-transform"></i>
                                <div class="text-left">
                                    <div class="text-[10px] text-gray-400 font-bold uppercase">客服微信</div>
                                    <div class="font-bold font-mono" x-text="config.contactWechat"></div>
                                </div>
                            </div>
                            <button @click="copyText" class="text-xs font-bold bg-black text-white px-3 py-1 rounded hover:bg-gray-800 active:scale-95 transition-all">复制</button>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl flex items-center justify-between border border-gray-100 group hover:border-gray-300 transition-colors">
                            <div class="flex items-center gap-3">
                                <i class="ph-fill ph-envelope text-blue-600 text-xl group-hover:scale-110 transition-transform"></i>
                                <div class="text-left">
                                    <div class="text-[10px] text-gray-400 font-bold uppercase">客服邮箱</div>
                                    <div class="font-bold font-mono" x-text="config.contactEmail"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-8 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400 font-mono uppercase">
                <div class="flex gap-4 mb-4 md:mb-0">
                    <a href="#" class="hover:text-black transition-colors">Privacy Policy</a>
                    <a href="#" class="hover:text-black transition-colors">Terms of Service</a>
                </div>
                <div>© 2026 BYGOU RECYCLE. ALL RIGHTS RESERVED.</div>
            </div>
        </div>
    </footer>

    <div 
        x-show="modalOpen" 
        class="fixed inset-0 z-50 flex items-center justify-center px-4"
        x-cloak
    >
        <div 
            class="absolute inset-0 bg-black/90 backdrop-blur-sm"
            x-show="modalOpen"
            x-transition.opacity
            @click="modalOpen = false"
        ></div>

        <div 
            class="relative w-full max-w-sm bg-white rounded-2xl p-0 overflow-hidden shadow-2xl"
            x-show="modalOpen"
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-8"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-8"
        >
            <div class="bg-black text-white p-6 flex justify-between items-center">
                <h3 class="font-bold text-lg">前往小程序</h3>
                <button @click="modalOpen = false" class="text-gray-400 hover:text-white transition-colors"><i class="ph-bold ph-x text-xl"></i></button>
            </div>

            <div class="p-8 text-center">
                <template x-if="isWeChat">
                    <div>
                        <p class="text-sm text-gray-500 mb-6 font-medium">长按下方二维码识别进入</p>
                        <div class="bg-gray-100 p-4 rounded-xl inline-block border-2 border-black border-dashed group hover:border-solid transition-all">
                            <img :src="config.qrCodeUrl" class="w-48 h-48 object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-300">
                        </div>
                    </div>
                </template>

                <template x-if="!isWeChat">
                    <div>
                        <div class="mb-6">
                            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2">第一步：复制名称</p>
                            <div class="flex gap-2">
                                <div class="flex-1 bg-gray-100 border border-gray-200 rounded-lg flex items-center px-4 font-bold font-mono text-lg select-all" x-text="config.wechatName"></div>
                                <button @click="copyText" class="bg-black text-white px-4 rounded-lg font-bold hover:bg-gray-800 active:scale-95 transition-all" :class="copied ? 'bg-green-600' : ''">
                                    <span x-show="!copied">复制</span>
                                    <span x-show="copied"><i class="ph-bold ph-check"></i></span>
                                </button>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2">第二步：微信搜索</p>
                            <div class="text-sm text-gray-600">打开微信粘贴搜索，或保存下方二维码扫一扫</div>
                            <div class="mt-4 mx-auto w-32 h-32 bg-gray-100 rounded p-2">
                                <img :src="config.qrCodeUrl" class="w-full h-full object-cover mix-blend-multiply">
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</body>
</html>
