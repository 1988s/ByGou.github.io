<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白狗回收 | 在线自主回收</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: -0.03em;
        }
        /* 当你没有上传图片时，背景会显示灰色圆点占位 */
        .qr-placeholder-bg {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 10px 10px;
        }
    </style>
</head>
<body class="bg-white text-black antialiased">

    <!-- 极简顶部 Header -->
    <header class="fixed top-0 w-full py-10 px-10 flex justify-between items-center z-50">
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
            <span class="text-sm font-bold tracking-widest uppercase">白狗回收</span>
        </div>
        <div class="text-[10px] font-bold text-slate-300 uppercase tracking-[0.3em]">
            Warehouse Direct
        </div>
    </header>

    <main class="min-h-screen flex flex-col items-center justify-center px-6">
        
        <!-- 核心引导区 Hero Section -->
        <div class="max-w-screen-sm w-full text-center">
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter mb-8">
                在线提交，<br>发往仓库。
            </h1>
            
            <p class="text-slate-400 text-sm md:text-base font-medium mb-16 tracking-wide">
                拍照上传 · 自主寄送 · 自动结算
            </p>

            <!-- 核心交互：二维码入口 -->
            <div class="relative inline-block group">
                <div class="w-48 h-48 md:w-56 md:h-56 p-4 bg-white border border-slate-100 rounded-2xl transition-all duration-700 group-hover:border-green-500 group-hover:shadow-2xl group-hover:shadow-green-50/50">
                    <div class="w-full h-full qr-placeholder-bg rounded-lg flex items-center justify-center overflow-hidden">
                        
                        <!-- 替换二维码说明： -->
                        <!-- 将下面的 src 属性替换为你真实的二维码图片链接 -->
                        <img 
                            src="images/qrcode.png" 
                            alt="小程序二维码" 
                            class="w-full h-full object-contain p-2"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                        >
                        
                        <!-- 图片加载失败时的备用占位符 (SVG) -->
                        <svg class="hidden w-24 h-24 text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <rect x="2" y="2" width="6" height="6" />
                            <rect x="16" y="2" width="6" height="6" />
                            <rect x="2" y="16" width="6" height="6" />
                            <path d="M10 2h4M2 10v4M16 10h6M10 16h4" />
                        </svg>

                    </div>
                </div>
                <!-- 引导标签 -->
                <div class="mt-8 opacity-20 group-hover:opacity-100 transition-opacity duration-700">
                    <span class="text-[10px] font-bold uppercase tracking-[0.5em]">Scan to Submit</span>
                </div>
            </div>
        </div>

        <!-- 三步流程 -->
        <div class="fixed bottom-24 w-full px-10">
            <div class="container mx-auto flex justify-between items-center max-w-4xl border-t border-slate-50 pt-10">
                <div class="text-center flex-1">
                    <span class="text-[10px] font-bold text-slate-200 block mb-2 tracking-widest">STEP 01</span>
                    <span class="text-xs font-bold uppercase tracking-widest">拍照提交</span>
                </div>
                <div class="w-10 h-[1px] bg-slate-50"></div>
                <div class="text-center flex-1">
                    <span class="text-[10px] font-bold text-slate-200 block mb-2 tracking-widest">STEP 02</span>
                    <span class="text-xs font-bold uppercase tracking-widest">发往仓库</span>
                </div>
                <div class="w-10 h-[1px] bg-slate-50"></div>
                <div class="text-center flex-1">
                    <span class="text-[10px] font-bold text-slate-200 block mb-2 tracking-widest">STEP 03</span>
                    <span class="text-xs font-bold uppercase tracking-widest">极速到账</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-10 w-full px-10 flex justify-between items-center text-[10px] text-slate-200 font-bold uppercase tracking-widest">
        <p>© 2024 BAIGOU</p>
        <div class="flex space-x-6 text-slate-300">
            <span>高效</span>
            <span>自主</span>
            <span>环保</span>
        </div>
    </footer>

</body>
</html>
